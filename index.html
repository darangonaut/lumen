<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07060d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lumen</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="dread"></div>
    <div id="hurt"></div>
    <div id="hud" hidden>
      <div class="hud-left">
        <div class="oil">
          <span class="oil-icon"></span>
          <div class="oil-bar"><div class="oil-fill"></div></div>
        </div>
        <div class="counts"><span class="fireflies"></span> <span class="crystals"></span></div>
      </div>
      <div class="hud-right">
        <div class="level-label"></div>
      </div>
      <button class="pause-btn" aria-label="Pauza">❚❚</button>
    </div>
    <div id="hint" hidden></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <div id="touch" hidden>
      <div class="pad-left">
        <button data-action="left" aria-label="Vľavo">◀</button>
        <button data-action="right" aria-label="Vpravo">▶</button>
      </div>
      <div class="pad-right">
        <button data-action="flare" class="flare" aria-label="Rozžiariť">✦</button>
        <button data-action="spark" class="spark" aria-label="Iskra">✸</button>
        <button data-action="jump" class="jump" aria-label="Skok">⤒</button>
      </div>
    </div>
    <section id="start" class="screen">
      <canvas class="logo"></canvas>
      <p class="tagline"></p>
      <div class="langs">
        <button data-lang="sk">SK</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="continue big" hidden></button>
      <button class="play big"></button>
      <button class="new-game" hidden></button>
      <button class="style-toggle"></button>
      <p class="controls"></p>
    </section>
    <section id="paused" class="screen" hidden>
      <h1 class="paused-title"></h1>
      <button class="resume big"></button>
      <button class="restart"></button>
      <button class="sound-toggle"></button>
      <button class="style-toggle"></button>
      <button class="to-menu"></button>
      <p class="paused-hint"></p>
    </section>
    <section id="done" class="screen" hidden>
      <h1 class="done-title"></h1>
      <p class="done-level"></p>
      <p class="done-stats"></p>
      <p class="done-world" hidden></p>
      <button class="next big"></button>
      <button class="replay"></button>
    </section>
    <section id="victory" class="screen" hidden>
      <h1 class="victory-title"></h1>
      <p class="victory-story"></p>
      <p class="victory-stats"></p>
      <p class="coming-soon"></p>
      <button class="victory-menu big"></button>
    </section>
    <div id="rotate"><p class="rotate-text"></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
